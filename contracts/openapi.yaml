        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /papers/{paper_id}:
    get:
      tags: [papers]
      summary: 试卷详情
      description: |
        归属与可见性（v1.0.3 / CHG-036）：教师（同角色）读**他人**试卷 → **403 `FORBIDDEN`**
        （含 draft 状态：教师管理视图视为可见，不得改成 404）；学生 → 403（角色）；试卷不存在 → 404 `NOT_FOUND`。
        认证优先（v1.0.3 / CHG-033）：无有效会话 → 401 `AUTH_REQUIRED`（GET 不校验 CSRF）。
      operationId: getPaper
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200':
