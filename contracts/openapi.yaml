        有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`。
        归属与可见性（v1.0.3 / CHG-036）：教师（同角色）改**他人**试卷 → **403 `FORBIDDEN`**（含 draft 状态）；
        学生 → 403（角色）；试卷不存在 → 404 `NOT_FOUND`；试卷已冻结 → 409 `PAPER_FROZEN`。
      operationId: updatePaper
