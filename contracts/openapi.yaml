openapi: 3.1.0
info:
  title: 选择题答题系统 API
  version: 1.0.3
  description: |
    契约版本 v1.0.3（2026-11-09，R2 Architect）。**V1 冻结前的最后一次契约修订**：关闭
    docs/13-contract-changes.md §8 的三条挂起待办（P-009 / P-010 / P-011），并统一一处权限判定口径
    （QA-002 指出的「他人 draft 资源 403/404」张力）。逐条登记见 docs/13-contract-changes.md
    **CHG-033..CHG-036**，决策与影响见 docs/10-arch.md **ADR-011**。
    **本版之后契约进入冻结终态（V1）：只允许 CHG 级变更——先登记 CHG + ADR，再改契约与版本号。**
    **G2 须按 v1.0.3 重新校验后方可继续 G4。**

    变更摘要（v1.0.2 → v1.0.3）：
    - CHG-033（P-009）**认证优先**：无有效会话 → **401 `AUTH_REQUIRED`**，**优先于 CSRF 校验与参数校验**
      （未认证请求即使缺 `X-CSRF-Token` 或参数非法，也返回 401，而不是 403/422）。写入
      `components.securitySchemes.sessionCookie.description` 与全部写接口 description。
    - CHG-034（P-010）`GET /healthz` 的 200 响应**显式声明 `db: {type: string}` 并加入 `required`**
      （实现执行 `SELECT 1` 探针后返回 `db:"ok"`；探针失败整体 503 统一 Error 体，不返回该对象）。
    - CHG-035（P-011）`AuditLog.actor_id` 改为 `type: [integer, "null"]`：系统操作 / CLI 记录为 **null**
      （BE-006 传 `actor_id=None`），字段仍必填（**总是出现**，只是值可为 null）；`ip` 仍为必填字符串，
      **系统操作记 `"-"`**。`AuditLogPage` 同步该口径。
    - CHG-036（QA-002）**可见性判定统一**：他人 draft / 未发布资源（**学生视角不可见**）→ **404**；
      可见但非本人 → **403**；角色不符 → **403**。教师对同角色他人的题目/试卷/考试（**含 draft**）一律
      **403**（教师管理视图视为可见），学生请求 draft 考试 → **404**。详见 docs/12 §2 与 ADR-011。
    - 校验：`Error.code` 枚举**已含** `NOT_SUBMITTED`（`server/app/errors.py` 在用）与 `IMPORT_PARTIAL`；
      本轮**不改**枚举（仍 16 值），无新增/删除错误码。

    兼容性：CHG-033 / CHG-036 为**语义澄清**（与中间件顺序、归属校验实现一致，无响应结构变化）；
    CHG-034 为**响应必填新增**（healthz 增加 `db`）；CHG-035 放宽 `actor_id`（`integer` → `integer|null`），
    读取方需容忍 null。无接口新增/删除。

    v1.0.2 变更摘要（v1.0.1 → v1.0.2，历史）：
    - CHG-024 `MyExamPage.server_time` 进 `required`；`GET /me/exams` description 写死「前端以
      `server_time` 校时；`session_status=in_progress` 且已过 `deadline_at` 时，服务端在读取时按到期
      规则结算，返回 `expired` 并带 `score`」（与 `GET /sessions/{id}` 的 200+expired 语义一致）。
    - CHG-025 上限自洽：`PaperQuestion.points.maximum` 1000 → **100**；`Paper.total_points.maximum`
      保持 **10000**（100 题 × 100 分 = 10000，恰不越界）。
    - CHG-026 `PaperCreate` 描述去矛盾：请求**只含** `title` + `questions`（每题 `points`）；
      `total_points` 由服务端计算并返回；服务端校验 `1 ≤ Σpoints ≤ 10000`，越界/非法 → 422。
    - CHG-027 快照条件不变量写进 schema description（字段仍 optional，不引入 if/then）：
      `Paper.status=frozen` 时 `frozen_at` 必返回；`Exam.status ∈ {published, closed}` 时
      `snapshot_version` 必返回；draft 阶段可为空，QA 按 `status` 条件断言。
    - CHG-028 可观测字段必需化：`SubmitResult.replayed` 与 `AnswerSaveResponse.applied` 进 `required`
      （服务端**总是**返回 true/false）；`SessionState.score/submitted_at` 保持 optional，但
      description 写死「`status=submitted|expired` 时必有值」。
    - CHG-029 logout 语义统一：有效会话 → **204**；无有效会话（未登录/已失效/已停用）→ **401**
      `AUTH_REQUIRED`；删除「已失效会话返回 204」，并写明**认证先于 CSRF**（401 优先于 403）。
    - CHG-030 教师不可读单会话结果：`GET /sessions/{id}/result` 仅学生本人（教师一律 403，
      教师走 `GET /exams/{id}/results` 读自己考试的汇总）；docs/12 权限矩阵同步。
    - CHG-031 `ExamResultSummary.average_score` 除零口径：无已判分会话时返回 **0**（仍 required number）。
    - CHG-032 废弃码清理：`ALREADY_SUBMITTED` 从 `Error.code` 枚举中移除（v1.0.1 起交卷已幂等 200）。

    v1.0.2 语义修正（非纯增量，旧客户端/实现需重读）：CHG-024/028 的必需化项（`server_time`/`replayed`/
    `applied`）、CHG-029 logout 401 口径（不再「恒 204」）、CHG-030 教师结果权限（由 ✅ 改 ❌）、
    CHG-032 `ALREADY_SUBMITTED` 移除（实现若返回该码即违契，映射为 `CONFLICT`）。

    v1.0.1 变更摘要（C-01..C-22）仍以 docs/13-contract-changes.md §1–§2 与 ADR-009 为准，本处不再重复。

    约定：
    - 认证：服务端 Session，HttpOnly Cookie `session_id`（8h 过期）
    - **判定顺序（v1.0.3 / CHG-033 / CHG-036，全局适用）**：① 无有效会话 → **401 `AUTH_REQUIRED`**
      （**优先于 CSRF 校验与参数校验**：未认证请求即使缺 `X-CSRF-Token` 或参数非法，也返回 401，
      不是 403/422）→ ② 已认证但写接口 CSRF 缺失/不匹配 → 403 `CSRF_INVALID` → ③ 角色不符 →
      403 `FORBIDDEN` → ④ 角色允许、资源**可见**但非本人/非其资源 → 403 `FORBIDDEN` → ⑤ 资源不可见
      （学生视角的 draft/未发布资源、软删除、不存在的 id）→ 404 `NOT_FOUND`。
    - CSRF：只在**已认证会话**上校验。所有非 GET 请求必须带 `X-CSRF-Token`（来自 /auth/me）；
      有会话但缺失/不匹配 → 403 `CSRF_INVALID`；**没有有效会话时先返回 401**（认证先于 CSRF）
    - 统一错误体：{ code, message, request_id }，`code` 取值见 `components.schemas.Error` 枚举
    - 时间：ISO 8601 UTC；分数：number，保留 2 位小数（`multipleOf: 0.01`）
    - 分页：page 从 1 开始，page_size 默认 20、最大 100
servers:
  - url: /api
    description: 通过 Nginx 反向代理的 API 前缀
tags:
  - name: system
  - name: auth
  - name: users
  - name: questions
  - name: papers
  - name: exams
  - name: sessions
  - name: me
  - name: audit

security:
  - sessionCookie: []

paths:
  /healthz:
    get:
      tags: [system]
      summary: 健康检查
      operationId: healthz
      security: []
      responses:
        '200':
          description: |
            服务存活且依赖可用（DB 可连接）。**`status` 与 `db` 必填**（v1.0.3 / CHG-034 / P-010）：
            实现每次请求执行 `SELECT 1` 探针，通过后返回 `{status:"ok", version, db:"ok"}`。
            `version` 由实现返回但保持 optional（向后兼容，QA 断言 `required` 时只强制 `status`/`db`）。
            探针失败时本接口整体返回 503（统一 Error），**不返回**本对象。
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
                  db:
                    type: string
                    description: 数据库探针结果（`SELECT 1` 通过）；实现固定返回 `"ok"`（CHG-034）。探针失败时走 503，不出现本字段的本对象
        '503':
          description: 依赖不可用（DB 连接失败/迁移未就绪）；deploy 健康检查据此判定实例不可用。C-19：返回统一 Error 体（code=INTERNAL_ERROR）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: 成功返回 `{user, csrf_token}` 并下发 HttpOnly `session_id`；失败**只有**一种口径（C-07）：
        401 + 固定 `code=AUTH_INVALID_CREDENTIALS` + 固定 message“用户名或密码错误”，
        不区分账号不存在/密码错误/账号停用，响应耗时由实现保证恒定（见 AC-02）。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功，Set-Cookie 下发 session_id（HttpOnly, Secure, SameSite=Lax, 8h）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出并吊销会话
      description: |
        吊销当前会话（`auth_sessions.revoked_at`）并清 Cookie（`Set-Cookie` 置过期）。
        语义统一（v1.0.2 / CHG-029，**不再声称“已失效会话返回 204”**）：

        | 场景 | 状态码 | 说明 |
        |---|---|---|
        | 有效会话 | **204** | 吊销当前会话并清 Cookie |
        | 无有效会话（未登录 / 已吊销 / 8h 过期 / 账号停用） | **401** | `code=AUTH_REQUIRED` |

        - **认证先于 CSRF**（与中间件实现一致，v1.0.3 / CHG-033 扩展为「401 优先于 CSRF **与参数校验**」）：
          先校验会话（无会话 → 401），再校验 `X-CSRF-Token`（有会话但 token 缺失/不匹配 → 403 `CSRF_INVALID`）。
          故未认证请求即使不带 CSRF 头，也返回 401 而不是 403；本接口无请求体，故不涉及参数校验分支。
        - 因此本接口**不是「恒 204」的幂等接口**：同一 Cookie 第二次登出已无有效会话 → 401，
          客户端应把 401 视为“已登出”并清空本地状态。
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已登出（有效会话被吊销并清 Cookie） }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfForbidden' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前登录用户与 CSRF token
      operationId: me
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [users]
      summary: 用户列表（仅 admin）
      operationId: listUsers
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [student, teacher, admin] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: 创建账号（仅 admin）
      description: 认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**，优先于 CSRF 校验与参数校验；有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`；之后才是角色（admin）与参数（422）校验。
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{user_id}:
    patch:
      tags: [users]
      summary: 修改角色/停用/重置密码（仅 admin）
      description: 认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**，优先于 CSRF 校验与参数校验；有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`；之后才是角色（admin）与参数（422）校验。用户不存在 → 404。
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPatch' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /questions:
    get:
      tags: [questions]
      summary: 题库列表（教师自己的；admin 全部）
      description: 可见性（v1.0.3 / CHG-036）：列表只返回当前主体**可见**集合（teacher 仅自己的题目，admin 全部）；学生调用 → **403 `FORBIDDEN`**（第 3 步角色判定，不因“无数据”返回空列表或 404）。分页参数非法 → 422（仅在已认证且角色允许后校验，CHG-033）。
      operationId: listQuestions
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/QuestionType' }
        - name: tag
          in: query
          schema: { type: string, maxLength: 32 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页题目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [questions]
      summary: 新建题目
      description: 认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**，优先于 CSRF 校验与参数校验；有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`；之后才是角色（teacher/admin）与字段校验（422）。
      operationId: createQuestion
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreate' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /questions/import:
    post:
      tags: [questions]
      summary: 批量导入（Excel/CSV，部分成功返回 200）
      description: 认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**，优先于 CSRF 校验与参数校验（未认证时连 multipart 缺失也返回 401，不是 400/403）；有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`。
      operationId: importQuestions
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 导入结果（可能部分失败）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /questions/{question_id}:
    get:
      tags: [questions]
      summary: 题目详情
      description: |
        归属与可见性（v1.0.3 / CHG-036）：教师（同角色）读**他人**题目 → **403 `FORBIDDEN`**
        （**含 draft 状态**：教师管理视图视为可见，属“可见但非本人”，不得改成 404）；学生 → 403（角色）；
        题目不存在 / 已软删除 → **404 `NOT_FOUND`**。
        认证优先（v1.0.3 / CHG-033）：无有效会话 → 401 `AUTH_REQUIRED`（GET 不校验 CSRF）。
      operationId: getQuestion
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: 题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [questions]
      summary: 修改题目
      description: |
        认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**（优先于 CSRF 校验与参数校验）；
        有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`。
        归属与可见性（v1.0.3 / CHG-036）：教师（同角色）改**他人**题目 → **403 `FORBIDDEN`**（含 draft 状态，
        教师管理视图视为可见）；学生 → 403（角色）；题目不存在 / 已软删除 → **404 `NOT_FOUND`**。
      operationId: updateQuestion
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreate' }
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [questions]
      summary: 删除题目（软删除；被引用时 409）
      description: |
        认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**（优先于 CSRF 与参数校验）；
        有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`。
        归属与可见性（v1.0.3 / CHG-036）：教师（同角色）删**他人**题目 → **403 `FORBIDDEN`**（含 draft 状态）；
        学生 → 403（角色）；题目不存在 / 已软删除 → **404 `NOT_FOUND`**；题目被试卷引用 → 409 `QUESTION_IN_USE`。
      operationId: deleteQuestion
      parameters:
        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /papers:
    get:
      tags: [papers]
      summary: 试卷列表
      description: 可见性（v1.0.3 / CHG-036）：只返回当前主体**可见**集合（teacher 仅自己的试卷，admin 全部）；学生调用 → **403 `FORBIDDEN`**（第 3 步角色判定）。
      operationId: listPapers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 分页试卷列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaperPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [papers]
      summary: 创建试卷（组卷）
      description: 认证优先（v1.0.3 / CHG-033）：无有效会话 → **401 `AUTH_REQUIRED`**，优先于 CSRF 校验与参数校验；有会话但缺/错 `X-CSRF-Token` → 403 `CSRF_INVALID`；之后才是角色（teacher/admin）与组卷校验（422/409）。
      operationId: createPaper
