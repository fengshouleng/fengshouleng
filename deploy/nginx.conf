# deploy/nginx.conf — ADR-008：TLS 终止（占位）+ 静态资源 + /api 反代
#
# 该文件被 deploy/Dockerfile.web 复制为 /etc/nginx/conf.d/default.conf，
# 因此只允许包含 **http 上下文内** 的指令（upstream / server），
# 不能写 events{}、http{}（已由镜像自带的 /etc/nginx/nginx.conf 提供）。
#
# 反代前缀说明（与 server/app/main.py 对齐）：
#   - 业务接口在容器内是 /api/...，本文件用 `proxy_pass http://exam_api;`（不带 URI）
#     原样转发，故外部 /api/questions → 容器内 /api/questions
#   - api 另外单独暴露 /healthz（运维探针）；外部 /healthz 显式转发到该路径

upstream exam_api {
    server api:8000;
    # 复用连接，降低高并发下的 TIME_WAIT（nginx 1.27 与 uvicorn 均支持）
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 题库导入：应用层上限 10 MiB（server/app/questions/importer.py MAX_IMPORT_BYTES），
    # 这里留到 20 MiB 以容纳 multipart 头部与浏览器差异；超过 20 MiB 由 nginx 直接 413。
    client_max_body_size 20m;
    client_body_timeout 60s;
    send_timeout 60s;

    # 基础安全响应头（HTTPS 就绪后再加 HSTS，见文件末尾 TLS 段）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # 文本资源压缩（图片/字体本身已压缩，不重复压）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA/接口均不缓存 HTML 之外的内容类型推断
    default_type application/octet-stream;

    # --- 运维探针：nginx 自身存活（compose healthcheck 使用，不依赖 api）------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- 运维探针：应用健康检查（ADR-008 的 /healthz）------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://exam_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --- API 反代：保留 /api 前缀 -------------------------------------------
    location /api/ {
        proxy_pass http://exam_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # 导入/导出可能较慢；与 client_body_timeout 同量级
        proxy_read_timeout 60s;
        # 请求体默认在 nginx 缓冲（proxy_request_buffering on），因此 20m 以内可直接透传；
        # 若改为 streaming（off），需同时评估断连重试与内存占用
    }

    # 精确 /api（无尾斜杠）→ 规范化，避免 404 困惑
    location = /api {
        return 308 /api/;
    }

    # --- 静态资源缓存 -------------------------------------------------------
    # Vite 产物位于 /assets/，文件名带内容哈希 → 可长期强缓存
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 其余带哈希/不常变的静态文件
    location ~* \.(?:js|mjs|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html 绝不缓存：发布后必须立即拿到新的 assets 引用
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # --- SPA 路由回退（React Router）---------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件/备份文件不对外
    # 注意：启用 ACME HTTP-01 证书续期时，需先为 /.well-known/acme-challenge/ 放行
    location ~ /\. {
        deny all;
    }
}

# ===========================================================================
# TLS 终止占位（上线前启用；当前默认仅 HTTP，便于 staging 先跑通）
#
# 启用步骤（详见 docs/70-runbook.md §8）：
#   1. 证书放到宿主 deploy/certs/{fullchain.pem,privkey.pem}（勿提交仓库）
#   2. compose 的 nginx 服务增加卷：- ./certs:/etc/nginx/certs:ro
#   3. compose 的 nginx 服务打开 443 映射，并在下方取消注释
#   4. 将上面 listen 80 的 server 改为仅做 301 跳转到 https
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name exam.example.com;          # 替换为真实域名
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;
#     ssl_prefer_server_ciphers off;
#
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     # 此处的 location 段与上面 listen 80 的 server 完全一致（root/静态/反代/探针），
#     # 启用时整段复制过来，避免两份配置漂移。
# }
#
# 注意：api 的 SESSION_COOKIE_SECURE 必须为 true（ADR-004），
# 否则浏览器会拒绝回传 Secure Cookie，表现为“登录成功但后续 401”。
# ===========================================================================
