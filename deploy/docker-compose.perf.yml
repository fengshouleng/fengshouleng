# deploy/docker-compose.perf.yml
# 仅供性能/容量测试的 compose 覆盖文件（不用于 staging/prod 部署）。
#
# 为什么需要：默认 compose 不发布 api 端口（只允许 edge 网络内的 nginx 访问）。
# 性能测试要由宿主上的 k6 直接打 api（Linux runner 上端口发布是 iptables DNAT，
# 不存在 Docker Desktop 的 host↔container 代理并发瓶颈），因此这里临时发布 18000。
#
# 另外把 PostgreSQL 的 max_connections 放宽到 200：压测口径是
# 「100 并发保存」，4 worker 需要 4×(池+溢出) 条连接同时可用；启动预热
# （docs/61 §10.2.11）会在启动阶段就把连接池填满，默认 100 上限会把预算卡死
# 在 96/100，任何一条额外连接（CLI、健康检查后的新连接）都可能撞上限。
#
# 用法（与主 compose 叠加）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.perf.yml \
#     --env-file deploy/.env.ci-perf -p exam-perf up -d --build postgres api
services:
  postgres:
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
  api:
    ports:
      - "18000:8000"
